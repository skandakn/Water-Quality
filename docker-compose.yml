version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jaal_drushti_postgres
    restart: always
    environment:
      POSTGRES_USER: jaal_user
      POSTGRES_PASSWORD: jaal_password
      POSTGRES_DB: jaal_drushti_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaal_user -d jaal_drushti_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Backend API (FastAPI + SQLAlchemy + Scikit-Learn)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaal_drushti_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://jaal_user:jaal_password@postgres:5432/jaal_drushti_db
      - SECRET_KEY=jaal-drushti-secret-key-production-ready-2026
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml

  # -------------------------------------------------------------
  # Frontend Web UI (React + Vite + Tailwind)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jaal_drushti_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
